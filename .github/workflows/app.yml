# Builds and tests the mobile and web app on every change to app/.
#
# The results are also published to the `ci-output` branch (analyzer report,
# test report, and the built web app), so they can be read without access to
# the GitHub Actions logs.
name: App

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Analyze, test and build for the web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the platform folders (first run only)
        id: create
        run: |
          if [ ! -d android ]; then
            flutter create --org org.tajweedapp --project-name tajweed_app --platforms android,ios,web .
            # flutter create adds a sample test that does not apply here.
            rm -f test/widget_test.dart
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          mkdir -p ../out
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee ../out/analyze.txt

      - name: Test
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee ../out/test.txt

      - name: Build for the web
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build web --release --no-web-resources-cdn 2>&1 | tee ../out/build-web.txt

      - name: Publish the reports and the web build to the ci-output branch
        if: always()
        working-directory: .
        run: |
          {
            echo "commit: ${GITHUB_SHA}"
            echo "analyze: ${{ steps.analyze.outcome }}"
            echo "test: ${{ steps.test.outcome }}"
            echo "build: ${{ steps.build.outcome }}"
            echo
            (cd app && flutter --version)
          } > out/summary.txt 2>&1
          if [ -d app/build/web ]; then cp -r app/build/web out/web; fi
          cd out
          git init -q -b ci-output
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Reports for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-output

      - name: Save the generated platform folders (first run only)
        if: steps.create.outputs.created == 'true'
        working-directory: .
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app
          git commit -q -m "Add the platform folders generated by flutter create" || exit 0
          git push origin HEAD:main || echo "::warning::Could not save the platform folders; main has moved on."

      - name: Fail if any step failed
        if: steps.analyze.outcome != 'success' || steps.test.outcome != 'success' || steps.build.outcome != 'success'
        run: |
          echo "::error::analyze=${{ steps.analyze.outcome }} test=${{ steps.test.outcome }} build=${{ steps.build.outcome }}"
          exit 1

  android:
    name: Build for Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the platform folders if missing
        run: |
          if [ ! -d android ]; then
            flutter create --org org.tajweedapp --project-name tajweed_app --platforms android,ios,web .
            rm -f test/widget_test.dart
          fi

      - name: Build a debug APK
        id: apk
        continue-on-error: true
        run: |
          mkdir -p ../out
          flutter pub get
          set -o pipefail
          flutter build apk --debug 2>&1 | tail -n 200 | tee ../out/build-android.txt

      - name: Publish the report to the ci-output-android branch
        if: always()
        working-directory: .
        run: |
          {
            echo "commit: ${GITHUB_SHA}"
            echo "android: ${{ steps.apk.outcome }}"
          } > out/summary.txt
          cd out
          git init -q -b ci-output-android
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Android report for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-output-android

      - name: Fail if the build failed
        if: steps.apk.outcome != 'success'
        run: exit 1
